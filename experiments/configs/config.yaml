defaults:
- _self_
- env: maze
- experiment: maze_default

ablation: none
post_run_ablation: False

evaluate: True
evaluation_episodes: 300
evaluate_heuristics: False

meta_step_type: commit

training_timesteps: 5e5
num_envs: 1
num_actors: 4
log_freq: 10
seed: 1701
meta_learning_rate: 3e-4
meta_discount: 0.995
meta_ent_coef: 0.0

energy_T: 1.0

bc_epochs: 3
bc_batch_size: 256
buffer_size: 100000
bc_buffer_samples: 50000

num_eval_resets: 10

smooth_window: 5

short_plan_reward_scale: 0.1
medium_plan_reward_scale: 0.25
long_plan_reward_scale: 0.5

plan_cost_scaling_factor: 0.5
action_noise: 0.0