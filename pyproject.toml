[project]
name = "when2plan"
version = "1.1.0"
description = "When2plan research code"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gymnasium==1.2.0",
    "gymnasium-robotics==1.4.2",
    "hydra-core==1.3.2",
    "shapely==2.1.2",
    "matplotlib==3.10.6",
    "minigrid==3.0.0",
    "mujoco==3.4.0",
    "numpy==2.3.3",
    "pandas==2.3.2",
    "pillow==11.3.0",
    "pygame==2.6.1",
    "scipy==1.16.1",
    "seaborn==0.13.2",
    "stable-baselines3==2.7.0",
    "torch==2.8.0",
    "tqdm==4.67.1",
    "ipykernel>=7.2.0",
]
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["when2plan*"]
